name: booster-break-dev

services:
  postgres:
    build: ./deploy/images/postgres
    image: booster-break-postgres:17.11-security.1
    pull_policy: build
    env_file:
      - ${BOOSTER_BREAK_ENV_FILE:-apps/api/.env.local}
    ports:
      - '127.0.0.1:5232:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
