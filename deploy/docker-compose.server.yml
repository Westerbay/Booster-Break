services:
  caddy:
    build: ./images/caddy
    image: booster-break-caddy:2.11.7-security.1
    pull_policy: build
    restart: unless-stopped
    env_file:
      - ${BOOSTER_BREAK_ENV_FILE:-booster-break.env}
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  web:
    image: ghcr.io/westerbay/booster-break/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - '80'

  postgres:
    build: ./images/postgres
    image: booster-break-postgres:17.11-security.1
    pull_policy: build
    restart: unless-stopped
    env_file:
      - ${BOOSTER_BREAK_ENV_FILE:-booster-break.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/westerbay/booster-break/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${BOOSTER_BREAK_ENV_FILE:-booster-break.env}
    environment:
      PORT: 3100
      HOST: 0.0.0.0
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3100'

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
