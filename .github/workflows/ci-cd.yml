name: CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # docker/metadata-action lowercases image names for GHCR.
  API_IMAGE_NAME: ${{ github.repository }}/api
  WEB_IMAGE_NAME: ${{ github.repository }}/web

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tcg:tcg_test@127.0.0.1:5432/tcg_test
      RUN_DATABASE_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        if: github.event_name == 'release'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi

      - name: Start disposable PostgreSQL from the security image
        run: |
          docker build --tag booster-break-postgres:ci deploy/images/postgres
          docker run --detach --name booster-ci-postgres \
            --publish 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_DB=tcg_test -e POSTGRES_USER=tcg -e POSTGRES_PASSWORD=tcg_test \
            booster-break-postgres:ci
          for attempt in $(seq 1 60); do
            if docker exec booster-ci-postgres pg_isready -U tcg -d tcg_test; then break; fi
            sleep 1
          done
          docker exec booster-ci-postgres pg_isready -U tcg -d tcg_test

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify dependency security patches
        run: bun run test:dependency-security

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply database migrations
        run: bun --cwd apps/api prisma:migrate:deploy

      - name: Test
        run: bun run test

  container-builds:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Build deployment image without publishing
        run: docker build --file apps/${{ matrix.app }}/Dockerfile --tag booster-${{ matrix.app }}:ci .

      - name: Verify API artifacts without running migrations
        if: matrix.app == 'api'
        run: >-
          docker run --rm --network none --entrypoint bun booster-api:ci
          -e "require('fs').accessSync('apps/api/dist/index.js'); require('./node_modules/.bun/node_modules/@prisma/client')"
      - name: Verify web server configuration
        if: matrix.app == 'web'
        run: docker run --rm --network none --entrypoint nginx booster-web:ci -t

  runtime-images:
    name: Runtime images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Build PostgreSQL and Caddy security images
        run: |
          docker build --tag booster-break-postgres:ci deploy/images/postgres
          docker build --tag booster-break-caddy:ci deploy/images/caddy
      - name: Verify SQL, TLS and reverse proxy routing with disposable fixtures
        run: bash scripts/security/runtime-images.sh

  publish-api:
    name: Publish API Image
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [quality, container-builds, runtime-images]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-web-image:
    name: Publish Web Image
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [quality, container-builds, runtime-images]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
